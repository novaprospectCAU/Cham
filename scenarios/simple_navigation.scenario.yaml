name: 단순 네비게이션
description: 페이지 이동과 기본 캡처만 테스트하는 최소 시나리오 (외부 앱 불필요)
target_url: https://example.com

steps:
  - action: navigate
    url: https://example.com
    anchor: "PageLoad"

  - action: wait
    ms: 1000

anchors:
  - name: "PageLoad"
    captures:
      - offset_ms: 0
        capture: [dom, screenshot]

assertions:
  - anchor: "PageLoad"
    offset_ms: 0
    type: selector_visible
    selector: "h1"
    expected: true
