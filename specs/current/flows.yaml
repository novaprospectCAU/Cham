flows:
  - name: self_verify_scenario_list
    description: 편집기 UI에 접속하여 시나리오 목록이 정상 렌더링되는지 확인
    steps:
      - action: navigate
        target: editor_dashboard
      - action: verify
        condition: ScenarioList visible
      - action: click
        target: ScenarioList.item
      - action: verify
        condition: ScenarioDetail visible

  - name: self_verify_diff_viewer
    description: 시나리오 선택 후 Diff Log와 스크린샷이 정상 표시되는지 확인
    steps:
      - action: navigate
        target: editor_dashboard
      - action: click
        target: ScenarioList.item_with_result
      - action: verify
        condition: ScreenshotCompare visible
      - action: verify
        condition: DiffLogViewer visible
      - action: verify
        condition: AssertionList visible

  - name: self_verify_confirm_flow
    description: 컨펌 버튼이 표시되고 동작하는지 확인
    steps:
      - action: navigate
        target: editor_dashboard
      - action: click
        target: ScenarioList.item_with_result
      - action: verify
        condition: ConfirmPanel visible
      - action: verify
        condition: ConfirmPanel.confirm_button enabled
      - action: verify
        condition: ConfirmPanel.reject_button enabled
