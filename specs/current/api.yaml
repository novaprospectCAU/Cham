api:
  POST /api/auth/login:
    description: 로그인
    input:
      email: "test@example.com"
      password: "password123"
    expected:
      status: 200
      response:
        token: "[jwt_format]"
        user:
          id: "[uuid]"
          name: "테스트 유저"
          email: "test@example.com"
      response_time_ms: "< 300"

  POST /api/auth/login (wrong credentials):
    description: 잘못된 로그인
    input:
      email: "test@example.com"
      password: "wrongpassword"
    expected:
      status: 401
      response:
        error: "INVALID_CREDENTIALS"

  GET /api/tasks:
    description: 할일 목록 조회
    headers:
      Authorization: "Bearer [token]"
    expected:
      status: 200
      response:
        tasks: "[array]"
        total: "[number]"
      response_time_ms: "< 200"

  GET /api/tasks (empty):
    description: 할일 없을 때
    expected:
      status: 200
      response:
        tasks: []
        total: 0

  POST /api/tasks:
    description: 할일 생성
    input:
      title: "새 할일"
      description: "설명"
      priority: "medium"
    expected:
      status: 201
      response:
        id: "[uuid]"
        title: "새 할일"
        status: "active"
        priority: "medium"
        created_at: "[datetime]"
      response_time_ms: "< 300"

  PATCH /api/tasks/:id/complete:
    description: 할일 완료 처리
    expected:
      status: 200
      response:
        id: "[uuid]"
        status: "completed"
        completed_at: "[datetime]"

  DELETE /api/tasks/:id:
    description: 할일 삭제
    expected:
      status: 200
      response:
        deleted: true