pages:
  login:
    route: /login
    components: [EmailField, PasswordField, LoginButton, ErrorMessage]
    flows:
      - trigger: LoginButton.click
        conditions:
          - both_fields_empty: true
        action: show ErrorMessage "이메일과 비밀번호를 입력해주세요"
      - trigger: LoginButton.click
        conditions:
          - email_valid: true
          - password_valid: true
        action: navigate /dashboard
      - trigger: LoginButton.click
        conditions:
          - credentials_wrong: true
        action: show ErrorMessage "이메일 또는 비밀번호가 올바르지 않습니다"
    assertions:
      - condition: "LoginButton.disabled == false"
      - condition: "ErrorMessage.visible == false on initial load"

  dashboard:
    route: /dashboard
    components: [Header, UserGreeting, TaskSummaryCard, CreateTaskButton, NavBar]
    flows:
      - trigger: CreateTaskButton.click
        action: navigate /tasks/new
      - trigger: NavBar.tasks.click
        action: navigate /tasks
      - trigger: NavBar.logout.click
        action: navigate /login
    assertions:
      - condition: "UserGreeting.text contains user name"
      - condition: "TaskSummaryCard.total_count == total tasks in DB"

  task_list:
    route: /tasks
    components: [Header, TaskItem, EmptyState, CreateTaskButton, FilterBar, NavBar]
    flows:
      - trigger: TaskItem.click
        action: navigate /tasks/:id
      - trigger: CreateTaskButton.click
        action: navigate /tasks/new
      - trigger: FilterBar.status.change
        conditions:
          - selected: "completed"
        action: show only completed TaskItems
      - trigger: FilterBar.status.change
        conditions:
          - selected: "active"
        action: show only active TaskItems
    assertions:
      - condition: "EmptyState.visible == true when tasks list is empty"
      - condition: "EmptyState.visible == false when tasks exist"
      - condition: "TaskItem count matches filtered results"

  task_detail:
    route: /tasks/:id
    components: [Header, TaskTitle, TaskDescription, StatusBadge, CompleteButton, DeleteButton, BackButton, EditForm]
    flows:
      - trigger: CompleteButton.click
        conditions:
          - task_status: "active"
        action: update StatusBadge to "completed", disable CompleteButton
      - trigger: DeleteButton.click
        action: show DeleteConfirmModal
      - trigger: DeleteConfirmModal.confirm
        action: navigate /tasks, remove task from list
      - trigger: DeleteConfirmModal.cancel
        action: close DeleteConfirmModal
      - trigger: BackButton.click
        action: navigate /tasks
    assertions:
      - condition: "CompleteButton.disabled == true when task already completed"
      - condition: "StatusBadge.text == task status"

  task_create:
    route: /tasks/new
    components: [Header, TitleField, DescriptionField, PrioritySelect, SubmitButton, CancelButton]
    flows:
      - trigger: SubmitButton.click
        conditions:
          - title_empty: true
        action: show TitleField validation error "제목을 입력해주세요"
      - trigger: SubmitButton.click
        conditions:
          - title_valid: true
        action: navigate /tasks, show new task at top of list
      - trigger: CancelButton.click
        action: navigate /tasks
    assertions:
      - condition: "TitleField.required == true"
      - condition: "PrioritySelect has options [low, medium, high]"