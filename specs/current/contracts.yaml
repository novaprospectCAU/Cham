contracts:
  spec_store → mcp_server:
    provides:
      current_spec: object
      spec_diff: object
      validation_results: array
      versions: array
    expects:
      root_dir: string
  scenario_engine → mcp_server:
    provides:
      scenario_list: array
      scenario_result: object
      frame_captures: array
    expects:
      root_dir: string
  diff_engine → mcp_server:
    provides:
      diff_log: object
      coverage_report: object
      baseline_management: object
    expects:
      root_dir: string
      scenario_results: object
      tolerances: object
